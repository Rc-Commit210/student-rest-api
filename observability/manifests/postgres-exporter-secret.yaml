apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-observability-store
  namespace: observability

spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"

      auth:
        tokenSecretRef:
          name: vault-token
          key: token

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-exporter-db-secret
  namespace: observability

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-observability-store
    kind: SecretStore

  target:
    name: postgres-exporter-db-secret
    creationPolicy: Owner

  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: student-api
        property: username

    - secretKey: DB_PASSWORD
      remoteRef:
        key: student-api
        property: password
