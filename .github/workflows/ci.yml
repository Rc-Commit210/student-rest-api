name: Student REST API CI

"on":
  push:
    branches:
      - master
    paths:
      - "app/**"
      - "tests/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "Makefile"
      - ".flake8"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    name: Build, Test, Lint, Push and Update Helm
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build API
        run: make build

      - name: Run tests
        run: make test

      - name: Perform code linting
        run: make lint

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: make docker-login

      - name: Build and push versioned Docker image
        run: |
          docker build \
            -t rcsanket753/student-rest-api:${IMAGE_TAG} .

          docker push \
            rcsanket753/student-rest-api:${IMAGE_TAG}

      - name: Update Helm image tag
        run: |
          sed -i \
            "s/^  tag: .*/  tag: ${IMAGE_TAG}/" \
            helm/student-api/values.yaml

          grep -A3 '^image:' helm/student-api/values.yaml

      - name: Commit Helm image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/student-api/values.yaml
          git commit -m "Update image tag to ${IMAGE_TAG} [skip ci]" || exit 0
          git push origin master
