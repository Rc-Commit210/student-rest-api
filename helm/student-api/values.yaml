replicaCount: 2

image:
  repository: rcsanket753/student-rest-api
  tag: a901309
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  targetPort: 5000

config:
  dbHost: postgres-service
  dbPort: "5432"
  dbName: studentdb
  appEnv: production

secret:
  name: student-api-db-secret

nodeSelector:
  type: application


database:
  replicaCount: 1

  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

  service:
    name: postgres-service
    port: 5432
    targetPort: 5432

  nodeSelector:
    type: database

  secret:
    name: student-api-db-secret

externalSecrets:
  secretStore:
    name: vault-secret-store
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: secret
      version: v2
      tokenSecretName: vault-token
      tokenSecretKey: token

  externalSecret:
    name: student-api-db-secret
    refreshInterval: 1h
    vaultKey: student-api
